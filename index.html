    <!-- Stale-bundle failsafe -->
    <script>
      (function () {
        function vsrReload() {
          var k = "cp_sr";
          var n = Number(sessionStorage.getItem(k) || 0);
          if (n < 2) {
            sessionStorage.setItem(k, String(n + 1));
            location.replace(location.origin + location.pathname + "?cb=" + Date.now());
          }
        }
        window.addEventListener("error", function (e) {
          var src = (e.target && (e.target.src || e.target.href || "")) || "";
          if (/\/assets\//.test(src)) vsrReload();
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          var msg = String((e.reason && (e.reason.message || e.reason.toString())) || "");
          if (/\/assets\//.test(msg) && /failed to fetch|could not be found|import\(\)/i.test(msg)) vsrReload();
        });
      })();
    </script>
